name: Windows desktop

on:
  workflow_dispatch:
  push:
    branches: ["trae/agent-ctCMlg", "codex/workbench-quality"]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:desktop
      - run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: AdsWorkbench-Windows-x64
          path: |
            dist/AdsWorkbench-*-x64.exe
            dist/AdsWorkbench-*-x64.zip
          if-no-files-found: error
