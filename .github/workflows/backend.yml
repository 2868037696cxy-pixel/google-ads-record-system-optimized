name: Linux backend
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: ["feat/team-console-ui-data-architecture", "deploy/render-workbench"]
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    strategy:
      matrix:
        node: ['22.22.2', '24']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: bash -n scripts/deploy-ubuntu.sh
  installation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Verify install, rollback fault injection and maintenance exclusion on disposable runner
        run: |
          set -Eeuo pipefail
          # Reproduce a root-only mktemp checkout; tar must not leave release '.' at 0700.
          source_mode="$(stat -c %a "$PWD")"
          trap 'chmod "$source_mode" "$PWD"' EXIT
          chmod 700 "$PWD"
          sudo env PATH="$PATH" bash scripts/deploy-ubuntu.sh
          sleep 2
          sudo systemctl is-active adsworkbench
          curl --fail http://127.0.0.1:4317/api/healthz

          current_before="$(readlink -f /opt/adsworkbench-current)"
          test "$(stat -c %a "$current_before")" = 755
          test "$(stat -c %U "$current_before")" = root
          sudo -u adsworkbench test -x "$current_before"
          sudo -u adsworkbench test -r "$current_before/server.js"
          unit_before="$(sudo sha256sum /etc/systemd/system/adsworkbench.service | awk '{print $1}')"
          backup_unit_before="$(sudo sha256sum /etc/systemd/system/adsworkbench-backup.service | awk '{print $1}')"
          backup_timer_before="$(sudo sha256sum /etc/systemd/system/adsworkbench-backup.timer | awk '{print $1}')"
          env_before="$(sudo sha256sum /etc/adsworkbench.env | awk '{print $1}')"
          sudo systemctl is-enabled adsworkbench
          sudo systemctl is-enabled adsworkbench-backup.timer

          sleep 1
          if sudo env PATH="$PATH" ADS_DEPLOY_TEST_FAILPOINT=after-backup-units bash scripts/deploy-ubuntu.sh; then
            echo 'Fault injection unexpectedly succeeded'
            exit 1
          fi
          test "$(readlink -f /opt/adsworkbench-current)" = "$current_before"
          test "$(sudo sha256sum /etc/systemd/system/adsworkbench.service | awk '{print $1}')" = "$unit_before"
          test "$(sudo sha256sum /etc/systemd/system/adsworkbench-backup.service | awk '{print $1}')" = "$backup_unit_before"
          test "$(sudo sha256sum /etc/systemd/system/adsworkbench-backup.timer | awk '{print $1}')" = "$backup_timer_before"
          test "$(sudo sha256sum /etc/adsworkbench.env | awk '{print $1}')" = "$env_before"
          sudo systemctl is-active adsworkbench
          sudo systemctl is-enabled adsworkbench
          sudo systemctl is-active adsworkbench-backup.timer
          sudo systemctl is-enabled adsworkbench-backup.timer
          curl --fail http://127.0.0.1:4317/api/healthz

          sudo bash -c 'exec 8>/var/lib/adsworkbench/.maintenance.lock; flock 8; sleep 6' &
          lock_pid=$!
          sleep 1
          if sudo env PATH="$PATH" bash scripts/deploy-ubuntu.sh; then
            echo 'Concurrent deployment unexpectedly bypassed the maintenance lock'
            kill "$lock_pid" || true
            exit 1
          fi
          wait "$lock_pid"
          test "$(readlink -f /opt/adsworkbench-current)" = "$current_before"
          sudo grep -F 'ExecStart=/usr/bin/flock -w 300 /var/lib/adsworkbench/.maintenance.lock' /etc/systemd/system/adsworkbench-backup.service

          sudo env PATH="$PATH" bash scripts/deploy-ubuntu.sh
          sudo systemctl is-active adsworkbench
          sudo systemctl start adsworkbench-backup.service
          sudo systemctl is-enabled adsworkbench-backup.timer
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4317/api/bootstrap)" = 401
      - name: Collect non-sensitive diagnostic logs
        if: failure()
        run: sudo journalctl -u adsworkbench -u adsworkbench-backup --no-pager -n 100
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar.gz --output=adsworkbench-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: AdsWorkbench-Source
          path: adsworkbench-source.tar.gz
          retention-days: 30
          if-no-files-found: error
