name: Apply reviewed workbench source
on:
  push:
    branches: ["feat/team-console-ui-data-architecture"]
    paths: [".maintenance/READY"]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == '2868037696cxy-pixel/google-ads-record-system-optimized' && github.ref == 'refs/heads/feat/team-console-ui-data-architecture'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Apply, verify and test the staged bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .maintenance -maxdepth 1 -name '*.patch' | wc -l)" = 14
          for patch in .maintenance/*.patch; do git apply --check "$patch"; git apply "$patch"; done
          rm -f tests/tls/localhost-cert.pem
          sha256sum --check .maintenance/source-hashes.txt
          npm install --package-lock-only --ignore-scripts
          npm ci --omit=dev --ignore-scripts
          npm test
          bash -n scripts/deploy-ubuntu.sh
      - name: Commit only verified source to the existing feature branch
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(git rev-parse HEAD)
          REMOTE=$(git ls-remote origin refs/heads/feat/team-console-ui-data-architecture | cut -f1)
          test "$BASE" = "$REMOTE"
          git rm -r .maintenance
          git add desktop lib public scripts tests docs package.json package-lock.json server.js
          git config user.name 'Workbench maintenance'
          git config user.email 'workbench-maintenance@users.noreply.github.com'
          git commit -m 'feat: verified secure remote desktop workbench 1.2'
          git push origin HEAD:refs/heads/feat/team-console-ui-data-architecture
