<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#090c11">
  <title>账号工作台 · Ads Operations Console</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23C8F65D'/%3E%3Cpath d='M10 23V9h6.5a4.5 4.5 0 0 1 0 9H10' fill='none' stroke='%23131A04' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css?v=20261007b">
</head>
<body class="boot">
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
            <path d="M5 19V5h7a5 5 0 0 1 0 10H5" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="18.4" cy="18.4" r="2.1" fill="currentColor"/>
          </svg>
        </span>
        <div class="brand-text">
          <strong>账号工作台</strong>
          <span>ADS CONSOLE</span>
        </div>
      </div>
      <nav class="nav" id="nav" aria-label="主导航"></nav>
      <div class="sidebar-foot">
        <button class="ghost-btn w-full" id="revealBtn" data-action="toggle-reveal">
          <span class="dot dot-eye"></span><span id="revealLabel">敏感信息：已隐藏</span>
        </button>
        <div id="desktopTools" hidden>
          <div class="desktop-actions">
            <button class="ghost-btn" data-action="desktop-backup" title="导出全部记录和资源">备份</button>
            <button class="ghost-btn" data-action="desktop-restore" title="从完整备份恢复">恢复</button>
            <button class="ghost-btn" data-action="desktop-data" title="打开本地数据文件夹">数据目录</button>
          </div>
          <p class="foot-note" id="desktopVersion">Windows 桌面版</p>
        </div>
        <p class="connection-status" id="connectionStatus" role="status">正在连接…</p>
        <button class="ghost-btn w-full" data-action="retry-load" title="重新读取数据（Ctrl+R）">重新连接</button>
        <p class="foot-note">记录与资源保存在本机<br>备份包含敏感信息，请妥善保存</p>
      </div>
    </aside>
    <main class="main" id="main"><section class="connection-panel" role="status"><h1>正在打开工作台</h1><p>正在加载界面…</p><noscript>请启用 JavaScript 后重试。</noscript></section></main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script src="/licenses.js?v=1.1.0"></script>
  <script src="/app.js?v=1.1.0"></script>
</body>
</html>
